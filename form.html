<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#eef8ff,#dff5ff,#ffffff);
    min-height:100vh;
}
/* Main Container */
.container{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}
/* Logo */
.logo{
    display:block;
    margin:auto;
    width:120px;
}

/* Heading */
h1,h2,h3{
    text-align:center;
    margin-bottom:20px;
}

/* Form */
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
    .form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.full-width{
    grid-column:1/-1;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.container{
margin:15px;
padding:20px;
}

}

/* Full Width */
.full-width{
    grid-column:1 / -1;
}

/* Labels */
label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{

width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{

outline:none;
border-color:#0077cc;
box-shadow:0 0 12px rgba(0,119,204,.25);

}
.submit-btn{

width:100%;
padding:18px;
background:linear-gradient(45deg,#0d6efd,#00a2ff);
border:none;
border-radius:50px;
color:#fff;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

.submit-btn:hover{

transform:translateY(-3px);
box-shadow:0 10px 20px rgba(0,0,0,.25);

}
/* Images */
img{
    max-width:100%;
    height:auto;
}

.floating-call,
.floating-map{

position:fixed;
right:20px;
padding:14px 20px;
border-radius:50px;
font-weight:bold;
color:#fff;
text-decoration:none;
z-index:999;
box-shadow:0 6px 18px rgba(0,0,0,.25);

}

.floating-call{
bottom:20px;
background:#28a745;
}

.floating-map{
bottom:85px;
background:#0d6efd;
}

@media(max-width:768px){

.floating-call,
.floating-map{

padding:12px 15px;
font-size:14px;
right:10px;

}

}
/* Mobile */
@media (max-width:768px){

    body{
        padding:10px;
    }

    .container{
        padding:20px;
    }

    form{
        grid-template-columns:1fr;
    }

    h1{
        font-size:28px;
    }

    input,
    select,
    textarea{
        font-size:16px;
    }

    .floating-call,
    .floating-map{
        right:10px;
        padding:12px 16px;
        font-size:14px;
    }

    .floating-map{
        bottom:70px;
    }

}

/* Large Screens */
@media (min-width:1200px){

.container{
    max-width:1100px;
}

} 

</style>

<body>
<div class="header">
<img src="logo.png" class="logo">
<h1>Sri Lakshmi Narasimha Old Age Home</h1>
<p>
Enquiry form for admission
</p>
</div>
<br>
 <a href="/slnoah/index.html" class="home-btn">🏠 Back to website</a><br>
<br>
<div class="container">  
<form action="https://api.web3forms.com/submit" method="POST">

name="access_key"
value="d9e42468-babe-470d-9bb2-2efdbeb8a31a">
<div>

<label>👤 Full Name *</label>

<input
type="text"
name="name"
placeholder="Enter your full name"
required
oninvalid="this.setCustomValidity('Please enter your full name')"

<div>

<input
type="email"
name="email"
placeholder="example@gmail.com"
required
oninvalid="this.setCustomValidity('Please enter a valid email address')"
oninput="this.setCustomValidity('')">
</div>
<div class="full-width">

<textarea

</div>
</body>
</html>
