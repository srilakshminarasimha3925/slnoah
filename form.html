<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f8ff;
    padding:20px;
    color:#333;
}

/* Main Container */
.container{
    width:100%;
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* Logo */
.logo{
    display:block;
    margin:auto;
    width:120px;
}

/* Heading */
h1,h2,h3{
    text-align:center;
    margin-bottom:20px;
}

/* Form */
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* Full Width */
.full-width{
    grid-column:1 / -1;
}

/* Labels */
label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

/* Inputs */
input,
select,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

/* Buttons */
button,
.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#0077cc;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#005fa3;
}

/* Images */
img{
    max-width:100%;
    height:auto;
}

/* Floating Buttons */
.floating-call,
.floating-map{
    position:fixed;
    right:20px;
    color:#fff;
    padding:14px 20px;
    border-radius:40px;
    text-decoration:none;
    font-weight:bold;
    z-index:999;
}

.floating-call{
    bottom:20px;
    background:#28a745;
}

.floating-map{
    bottom:80px;
    background:#0d6efd;
}

/* Mobile */
@media (max-width:768px){

    body{
        padding:10px;
    }

    .container{
        padding:20px;
    }

    form{
        grid-template-columns:1fr;
    }

    h1{
        font-size:28px;
    }

    input,
    select,
    textarea{
        font-size:16px;
    }

    .floating-call,
    .floating-map{
        right:10px;
        padding:12px 16px;
        font-size:14px;
    }

    .floating-map{
        bottom:70px;
    }

}

/* Large Screens */
@media (min-width:1200px){

.container{
    max-width:1100px;
}

} 

</style>

<body>

<div class="header">

<h1>🏡 Sri Lakshmi Narasimha Old Age Home</h1>

<p>
Enquiry Form for admission
</p> <br>
 <a href="/slnoah/index.html" class="home-btn">🏠 Back to website</a><br>
 
</div>
<div class="container">  
<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden"
name="access_key"
value="d9e42468-babe-470d-9bb2-2efdbeb8a31a">
<div>

<label>👤 Full Name *</label>

<input
type="text"
name="name"
placeholder="Enter your full name"
required
oninvalid="this.setCustomValidity('Please enter your full name')"
oninput="this.setCustomValidity('')">
</div>
<div>

<label>📞 Mobile Number *</label>

<input
type="tel"
name="mobile"
placeholder="9087612326"
pattern="[6-9][0-9]{9}"
maxlength="10"
required
oninvalid="this.setCustomValidity('Please enter a valid 10-digit Indian mobile number')"
oninput="this.setCustomValidity('')">
</div>
<div>

<label>📧 Email Address *</label>

<input
type="email"
name="email"
placeholder="example@gmail.com"
required
oninvalid="this.setCustomValidity('Please enter a valid email address')"
oninput="this.setCustomValidity('')">
</div>
<div class="full-width">
<label>📝 Your Enquiry *</label>

<textarea
name="message"
rows="5"
placeholder="Write your enquiry here..."
required
oninvalid="this.setCustomValidity('Please enter your enquiry')"
oninput="this.setCustomValidity('')"></textarea>
</div>
<div class="full-width">
<button type="submit">
📩 Submit Enquiry
</button>
</div>
<input type="hidden" name="redirect" value="https://srilakshminarasimha3925.github.io/slnoah/thankyou.html">
</form>
</div>
</body>
</html>
