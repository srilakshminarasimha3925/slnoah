<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<style>
.header{

background:linear-gradient(135deg,#0077cc,#00c6ff);

color:white;

padding:35px;

border-radius:20px 20px 0 0;

text-align:center;

margin:-35px -35px 35px;

}
.subtitle{

font-size:20px;

margin-top:10px;

opacity:.95;

}
.logo{

width:130px;

height:130px;

border-radius:50%;

background:white;

padding:10px;

box-shadow:0 10px 20px rgba(0,0,0,.25);

margin-bottom:15px;

}
input,
textarea{

background:#f7fbff;

border:2px solid #d7e9ff;

}

input:hover,
textarea:hover{

border-color:#0077cc;

}
.submit-btn{

background:linear-gradient(45deg,#ff6a00,#ff9900);

font-size:22px;

border-radius:50px;

}

.submit-btn:hover{

transform:scale(1.03);

}
.home-btn{

display:inline-block;

padding:14px 35px;

background:#343a40;

color:white;

border-radius:50px;

text-decoration:none;

font-weight:bold;

transition:.3s;

}

.home-btn:hover{

background:#000;

}
footer{

margin-top:40px;

padding:20px;

text-align:center;

color:#777;

font-size:15px;

}
body{

font-family:'Segoe UI',sans-serif;

background:linear-gradient(-45deg,
#d9f4ff,
#eefcff,
#ffffff,
#c8f1ff);

background-size:400% 400%;

animation:bg 12s ease infinite;

}
@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* Form */
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
    .form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.full-width{
    grid-column:1/-1;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.container{
margin:15px;
padding:20px;
}

}

/* Full Width */
.full-width{
    grid-column:1 / -1;
}

/* Labels */
label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{

width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{

outline:none;
border-color:#0077cc;
box-shadow:0 0 12px rgba(0,119,204,.25);

}
.submit-btn{

width:100%;
padding:18px;
background:linear-gradient(45deg,#0d6efd,#00a2ff);
border:none;
border-radius:50px;
color:#fff;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

.submit-btn:hover{

transform:translateY(-3px);
box-shadow:0 10px 20px rgba(0,0,0,.25);

}
/* Images */
img{
    max-width:100%;
    height:auto;
}

.floating-call,
.floating-map{

position:fixed;
right:20px;
padding:14px 20px;
border-radius:50px;
font-weight:bold;
color:#fff;
text-decoration:none;
z-index:999;
box-shadow:0 6px 18px rgba(0,0,0,.25);

}

.floating-call{
bottom:20px;
background:#28a745;
}

.floating-map{
bottom:85px;
background:#0d6efd;
}

@media(max-width:768px){

.floating-call,
.floating-map{

padding:12px 15px;
font-size:14px;
right:10px;

}

}
/* Mobile */
@media (max-width:768px){

    body{
        padding:10px;
    }

    .container{
        padding:20px;
    }

    form{
        grid-template-columns:1fr;
    }

    h1{
        font-size:28px;
    }

    input,
    select,
    textarea{
        font-size:16px;
    }

    .floating-call,
    .floating-map{
        right:10px;
        padding:12px 16px;
        font-size:14px;
    }

    .floating-map{
        bottom:70px;
    }

}

/* Large Screens */
@media (min-width:1200px){

.container{
    max-width:1100px;
}

} 

</style>
