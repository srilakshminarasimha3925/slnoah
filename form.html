<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry – Sri Lakshmi Narasimha Old Age Home</title>
</head>
  
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
linear-gradient(
rgba(230,248,255,.88),
rgba(220,255,240,.88)
),
url("images/oldagehome-bg.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.container{

width:100%;
max-width:620px;

background:#ffffff;

padding:40px;

border-radius:25px;

box-shadow:
0 15px 45px rgba(0,0,0,.15);

border-top:8px solid #00a651;

transition:.3s;

}

.container:hover{

transform:translateY(-5px);

box-shadow:
0 25px 55px rgba(0,0,0,.22);

}

.logo{

text-align:center;

font-size:45px;

margin-bottom:10px;

}

h1{

text-align:center;

font-size:34px;

color:#0066cc;

margin-bottom:8px;

text-shadow:1px 1px 3px rgba(0,0,0,.12);

}

.subtitle{

text-align:center;

color:#555;

margin-bottom:30px;

}

label{

display:block;

margin-top:18px;

font-size:16px;

font-weight:600;

color:#006699;

}

input,
textarea{

width:100%;

padding:16px;

margin-top:8px;

border:2px solid #d8ecff;

border-radius:12px;

background:#f9fcff;

font-size:16px;

transition:.3s;

}

input:focus,
textarea:focus{

border-color:#00a651;

background:white;

box-shadow:0 0 15px rgba(0,166,81,.25);

}
textarea{

resize:none;

}

button{

width:100%;

padding:17px;

margin-top:30px;

border:none;

border-radius:50px;

font-size:18px;

font-weight:bold;

cursor:pointer;

color:white;

background:
linear-gradient(90deg,#0077ff,#00c853);

transition:.3s;

}

button:hover{

background:
linear-gradient(90deg,#005be0,#00a651);

transform:scale(1.02);

}
.header{

text-align:center;

margin-bottom:30px;

}

.header p{

color:#555;

font-size:17px;

margin-top:8px;

}

.note{

margin-top:25px;

text-align:center;

font-size:14px;

color:#666;

}

@media(max-width:600px){

.container{

padding:25px;

}

h1{

font-size:24px;

}

}

</style>

<body>

<div class="header">

<h1>🏡 Sri Lakshmi Narasimha Old Age Home</h1>

<p>
Enquiry Form for admission
</p> <br>
 <h2 class="section-title">Google Maps</h2>
<p><strong>Branch 1 – Saroornagar</strong><br>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1648.7253422423682!2d78.52995865792296!3d17.35489388183877!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb991523337fe3%3A0x986bcb79b091ffea!2sSri%20Lakshmi%20Narasimha%20Old%20Age%20Home!5e1!3m2!1sen!2sin!4v1764430125846!5m2!1sen!2sin" class="map"></iframe><br>
  <p><strong>Branch 2 – Chaitanyapuri</strong><br>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3297.090492487305!2d78.53665467440369!3d17.374909203166055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb99476b708181%3A0xf6ff005dce47e361!2sSri%20Lakshmi%20Narasimha%20Old%20age%20home!5e1!3m2!1sen!2sin!4v1779703162684!5m2!1sen!2sin" class="map"></iframe><br>
</div>
  
<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden"
name="access_key"
value="d9e42468-babe-470d-9bb2-2efdbeb8a31a">

<label>👤 Full Name *</label>

<input
type="text"
name="name"
placeholder="Enter your full name"
required
oninvalid="this.setCustomValidity('Please enter your full name')"
oninput="this.setCustomValidity('')">

<label>📞 Mobile Number *</label>

<input
type="tel"
name="mobile"
placeholder="9087612326"
pattern="[6-9][0-9]{9}"
maxlength="10"
required
oninvalid="this.setCustomValidity('Please enter a valid 10-digit Indian mobile number')"
oninput="this.setCustomValidity('')">

<label>📧 Email Address *</label>

<input
type="email"
name="email"
placeholder="example@gmail.com"
required
oninvalid="this.setCustomValidity('Please enter a valid email address')"
oninput="this.setCustomValidity('')">

<label>📝 Your Enquiry *</label>

<textarea
name="message"
rows="5"
placeholder="Write your enquiry here..."
required
oninvalid="this.setCustomValidity('Please enter your enquiry')"
oninput="this.setCustomValidity('')"></textarea>

<button type="submit">
📩 Submit Enquiry
</button>

<input type="hidden" name="redirect" value="https://srilakshminarasimha3925.github.io/slnoah/thankyou.html">
<input type="Home" name="redirect" value="https://srilakshminarasimha3925.github.io/slnoah/index.html">

</form>

</body>
</html>
